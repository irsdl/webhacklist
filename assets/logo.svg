<svg xmlns="http://www.w3.org/2000/svg" width="840" height="260" viewBox="0 0 840 260" role="img" aria-label="Web Hack List Index — independent web hacking research archive, 2006 to present">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#131f3a"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="neonV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182848"/>
      <stop offset="1" stop-color="#0d1526"/>
    </linearGradient>
  </defs>

  <!-- card -->
  <rect x="1.5" y="1.5" width="837" height="257" rx="22" fill="url(#bg)" stroke="url(#neon)" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- browser-window dots -->
  <circle cx="36" cy="34" r="6" fill="#f87171"/>
  <circle cx="58" cy="34" r="6" fill="#fbbf24"/>
  <circle cx="80" cy="34" r="6" fill="#4ade80"/>
  <line x1="2" y1="56" x2="838" y2="56" stroke="#22d3ee" stroke-opacity="0.15" stroke-width="1"/>

  <!-- faint code glyph -->
  <text x="812" y="228" font-family="Consolas, 'Courier New', monospace" font-size="150" font-weight="700" fill="#22d3ee" fill-opacity="0.07" text-anchor="end" aria-hidden="true">&lt;/&gt;</text>

  <!-- shield mark -->
  <g>
    <path d="M132 68 L194 89 V140 C194 175 169 200 132 214 C95 200 70 175 70 140 V89 Z" fill="url(#shieldFill)" stroke="url(#neonV)" stroke-width="3" stroke-linejoin="round"/>
    <g transform="translate(90 100) scale(1.3)">
      <path d="M5 11h21l9 7h24M5 30h16l10 8h28M5 50h23l8 6h23" fill="none" stroke="#ffb454" stroke-width="3.5" stroke-linecap="square" stroke-linejoin="miter"/>
      <path d="M41 4 29 23l9 10-13 27" fill="none" stroke="#7899ff" stroke-width="4.5" stroke-linecap="square" stroke-linejoin="miter"/>
      <circle cx="37.5" cy="33" r="3.25" fill="#f4efe6"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="240" y="98" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#4ade80">~$ webhacklist --list --all --since 2006</text>
  <text x="238" y="150" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="800" fill="#f3f6fc" letter-spacing="1">WEB HACK LIST</text>
  <text x="238" y="196" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="800" fill="url(#neon)" letter-spacing="1">INDEX<tspan font-size="20" font-weight="600" fill="#8ea0c0" dx="14" dy="-2">2006 → Present</tspan></text>
  <text x="240" y="230" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#8ea0c0">Official nominations + additional research · Markdown + PDF</text>
</svg>
