name: Deploy archive website to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "website/**"
      - "archived-references/manifest.json"
      - "archived-references/source-groups.json"
      - "archived-references/tag-vocabulary.json"
      - "archived-references/md/**"
      - "archived-references/pdf/**"
      - "tools/references/related-sources.json"
      - "original-listings/**"
      - "*.md"
      - ".gitignore"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out archive
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Check generated data stays out of Git
        run: node --test website/generated-data-guard-test.mjs

      - name: Generate synchronized website data
        run: |
          node website/build-data.mjs
          git diff --exit-code -- website/story-identities.json

      - name: Validate production JavaScript and generated data
        run: |
          node --test website/archive-invariants-test.mjs
          node --check website/app.js
          node --check website/constellation.js
          node --test website/constellation-test.mjs
          node --test website/review-regression-test.mjs
          node --test website/pdf-reader-polyfills-test.mjs
          node --test website/pdfjs-release-test.mjs
          node --check website/build-data.mjs
          node --check website/build-pages.mjs
          node --check website/build-site.mjs
          node website/build-data.mjs --check
          node website/readme-counts-test.mjs

      - name: Validate the generated crawlable pages and sitemap
        run: node website/pages-test.mjs

      - name: Stage the site root and preserved documents
        run: |
          node website/build-site.mjs --target github --output _site
          test -f _site/index.html
          test "$(du -sb _site | cut -f1)" -lt 1000000000
          du -sh _site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
